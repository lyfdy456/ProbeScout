# 三阶段 VQA 属性抽取 pipeline 配置 (融合假想对比机制 + 颜色靶向分离)
# Stage1 逐图描述 -> Stage2 总结共性属性(JSON) -> Stage3 自动筛选 -> {attr1, attr2, ...}

api_key: ""
base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
model: "qwen-vl-max"

# query 图目录 与 输出目录（默认写到该 task 的 qa/ 下）
query_dir: "/mnt/share/LF/vlm/query/SUN__task_wood_cloth_electriclighting/query_pics"
out_dir: "/mnt/share/LF/vlm/qa2/SUN__task_wood_cloth_electriclighting"

# Stage3 自动筛选参数
# 硬性规则：属性必须在每张 query 图中都出现（unclear_or_absent_images 为空）；verifiability 必须为 high
max_attrs: 6                 # 最终保留的属性上限
allow_subjectivity: ["low"]  # 【重要】只保留 low，剔除主观和模糊的描述，确保底层物理属性
allow_verifiability: ["high"]             # 仅保留 high（排除 medium / low）

# 运行参数
max_tokens: 2048
timeout: 90
max_retries: 4
workers: 5                   # Stage1 逐图描述的并发数

# ── Stage1: 单张 query 图详细描述 ──
prompt_stage1: |
  You are given a query image from a fine-grained image retrieval task.

  Describe the image in as much visual detail as possible. Focus only on visible information.

  Please include:
  1. Main object/category
  2. Exact object color, texture, and shape
  3. Important parts and their exact visible attributes
  4. Background or scene
  5. Pose, viewpoint, spatial layout, and composition
  6. Lighting, blur, image quality, and visual style
  7. Weather-, atmosphere-, or condition-related visible cues
  8. Any other visually distinctive details

  Use concrete visual wording whenever possible. 
  Do not infer non-visible information.
  Return a concise but detailed paragraph. 
  
  CRITICAL RULE 1 (FUNDAMENTAL TRAITS): While describing, heavily prioritize fundamental, atomic physical traits (e.g., specific colors, body parts, physical contact points) over abstract scene narratives. Ignore backgrounds if possible.
  CRITICAL RULE 2 (HYPOTHETICAL CONTRAST): Even though you only see a positive example, you MUST extract features that are HIGHLY DISCRIMINATIVE. Imagine similar but incorrect interactions or states (e.g., if the image shows "riding", imagine "pushing"; if it shows a "zebra", imagine a normal "horse"). Explicitly describe the exact physical cues (e.g., feet placement, precise coat patterns) that uniquely prove the specific state shown in the image.

# ── Stage2: 多张描述总结共性属性（文本输入，返回 JSON）──
prompt_stage2: |
  You are given detailed descriptions of several query images from the same fine-grained retrieval target.

  Your task is to identify visual attributes shared by most of these query images.

  The attributes should be useful as binary probing labels for candidate images. Prefer concrete, visually verifiable, value-bearing attributes.

  Inclusion threshold:
  - Let N be the number of query image descriptions.
  - An attribute may be included only if it is visibly supported in at least floor(0.8 * N) query images.

  Requirements:
  1. Extract attributes that may help distinguish the target images from non-target images. HYPOTHETICAL CONTRAST: The attributes must act as strict binary probes to weed out highly similar but incorrect cases.
  2. Provide BOTH coarse-grained and fine-grained attributes:
    - Coarse-grained: high-level identity / category / brand / body-type concepts (e.g. "BMW vehicle", "convertible body type", "two-door sports car"). These are allowed and encouraged even though they are category-level.
    - Fine-grained: specific value-bearing visual cues (e.g. "BMW kidney grille with vertical slats", "multi-spoke alloy wheels").
  3. MANDATORY COARSE ATTRIBUTES: You MUST extract the overarching brand/identity (e.g., "BMW vehicle") and body style (e.g., "convertible body") as the first 1-2 attributes. Do not ignore the high-level ground truth.
  4. VIEWPOINT INVARIANCE: Coarse identity attributes (like brand or body type) are conceptually present in ALL images. Even if specific logos or grilles are hidden by the rear camera angle, you MUST list ALL query images in `visible_in_images` for these coarse attributes and strictly leave `unclear_or_absent_images` empty.
  5. Each fine-grained attribute must be atomic and specific. CRITICAL FORMAT: The attribute `name` MUST be extremely concise, strictly consisting of 2 to 4 words only (e.g., "BMW vehicle", "convertible body", "kidney grille"). Do NOT use full sentences.
  6. COLOR SEPARATION: You MUST extract BOTH the base background colors AND the localized markings. Do not bundle base colors into the coarse identity description; break them out into their own attributes.
  7. ZERO BACKGROUND: Absolutely DO NOT extract any environment, habitat, or background attributes. Focus 100% on the main subject.
  8. Set shared_strength to "strong" only when clearly supported in all query descriptions. If a body part (like a belly) is hidden by the animal's posture in one image but clear in others, you may assume it is present and mark it "strong" based on prior knowledge of the species.
  9. Return 3 to 12 common attributes. List coarse identity/category attributes first, then fine-grained concrete attributes.
  Query image descriptions:
  {descriptions}

  Return the result as JSON:

  {
    "target_concept_summary": "short natural language summary of the shared visual target",
    "attributes": [
      {
        "name": "strictly 2-4 words (e.g., 'white fluffy belly', 'black eye patches')",
        "description": "clear definition including exact visible values and where they appear",
        "type": "concrete | visual_quality | abstract",
        "shared_strength": "strong | partial",
        "visible_in_images": ["query_1", "query_2"],
        "unclear_or_absent_images": [],
        "verifiability": "high | medium | low",
        "subjectivity": "low | medium | high"
      }
    ]
  }