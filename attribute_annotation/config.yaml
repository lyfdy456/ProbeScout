# VQA 自动打标配置文件（API 模式）

# ─────────────────────────────────────────────
# API 配置（阿里云百炼 - Qwen-VL，OpenAI 兼容接口）
# ─────────────────────────────────────────────
api_key: ""
base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
model: "qwen-vl-max"

# ─────────────────────────────────────────────
# 数据路径
# ─────────────────────────────────────────────
images_dir: "../dataset/raw/SUN/images"
output_dir: "../outputs/vqa_labels"

# ─────────────────────────────────────────────
# Prompt 模板（单张图片模式）
# 支持占位符:
#   {image_id}    → 当前图片文件名
#   {attributes}  → attributes 字段的内容
# ─────────────────────────────────────────────
prompt: |
  You are given an image and a list of target visual attributes.

  For each attribute, decide whether it is present in the image.

  Use:
  - 1 if the attribute is present
  - 0 if the attribute is absent

  You MUST return exactly 0 or 1 for every target attribute. Never return
  "unknown" or null. If visual evidence is incomplete, make the best binary
  judgment from the visible cues and express uncertainty only through a lower
  confidence score.

  For abstract, subjective, visually grounded soft, or low-verifiability attributes, make the best judgment based on visible evidence and reflect uncertainty in the confidence score.

  The evidence field must cite the concrete visual cue that supports the decision, including exact color, part, shape, texture, lighting, weather-like cue, atmospheric cue, or background detail when relevant.

  Target attributes:
  {attributes}

  Return the result as JSON:

  {
    "image_id": "{image_id}",
    "attributes": {
      "attr1": {
        "present": 1,
        "confidence": 0.90,
        "evidence": "brief visual evidence"
      },
      "attr2": {
        "present": 0,
        "confidence": 0.80,
        "evidence": "brief visual evidence"
      }
    }
  }

# 属性列表（插入到 prompt 的 {attributes} 位置）
attributes: |
  (person actively walking across street on marked pedestrian crosswalk, thick white or rainbow-colored parallel stripes marking pedestrian crosswalk, grey asphalt road surface with visible texture and minor cracks)

# ─────────────────────────────────────────────
# 运行参数
# ─────────────────────────────────────────────
delay: 1          # 请求间隔（秒）
max_retries: 3    # 单张图片失败重试次数
timeout: 60       # 单次请求超时（秒）
max_tokens: 4096  # 模型最大返回 token 数
